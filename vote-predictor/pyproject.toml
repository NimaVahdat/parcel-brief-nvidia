[project]
name = "vote-predictor"
version = "0.0.1"
description = "Predicts how Toronto council will vote on a development application."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "joblib>=1.3",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
]

[project.scripts]
vote-predictor = "vote_predictor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vote_predictor"]
