[project]
name = "vote-predictor"
version = "0.0.1"
description = "Predicts how Toronto council will vote on a development application, by precedent retrieval over real TMMIS outcomes."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
]

[project.optional-dependencies]
pg = ["pgvector>=0.2", "psycopg[binary]>=3.1"]
scrape = ["playwright>=1.43"]

[project.scripts]
vote-predictor = "vote_predictor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vote_predictor"]
