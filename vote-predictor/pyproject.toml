[project]
name = "vote-predictor"
version = "0.0.1"
description = "Predicts how Toronto council will vote on a development application."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "httpx>=0.27",
    "playwright>=1.44",
    "pypdf>=4.2",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
vote-predictor = "vote_predictor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vote_predictor"]
