[project]
name = "parcel-brief"
version = "0.0.1"
description = "Toronto real estate pre-acquisition analysis system"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "vote-predictor",
    "opposition-generator",
    "massing-generator",
    "site-proforma",
    "connector",
]

[tool.uv.sources]
vote-predictor = { workspace = true }
opposition-generator = { workspace = true }
massing-generator = { workspace = true }
site-proforma = { workspace = true }
connector = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Vendored 3D-render engine (from the nvidia-hack prototype). Keep the proven
# rendering math intact rather than refactor it to satisfy style-only lints.
"**/massing_generator/builder/build_3d.py" = ["B905"]
"**/massing_generator/builder/render_pyvista.py" = ["B007", "B023", "E702", "E731", "E741", "F841", "UP031"]
"**/massing_generator/builder/textures.py" = ["B905", "E702"]
"**/massing_generator/builder/validate_building.py" = ["E741"]
