[project]
name = "massing-generator"
version = "0.0.1"
description = "Generates 3D building massings that fit a zoning envelope."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "diffusers>=0.27",
    "transformers>=4.40",
    "accelerate>=0.30",
    "peft>=0.10",
    "torch>=2.2",
    "pillow>=10.0",
    "trimesh>=4.0",
    "shapely>=2.0",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
]

[project.scripts]
massing-generator = "massing_generator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/massing_generator"]
