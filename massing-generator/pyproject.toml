[project]
name = "massing-generator"
version = "0.0.1"
description = "Generates 3D building massings that fit a zoning envelope."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40",
    "plotly>=5.20",
    "pyvista>=0.43",
    # pyvista's standalone HTML export goes through a trame server
    "trame>=3.0",
    "trame-vtk>=2.8",
    "trame-vuetify>=2.7",
    "nest-asyncio2>=1.7",
    "imageio>=2.30",
    "pillow>=10.0",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
]

[project.scripts]
massing-generator = "massing_generator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/massing_generator"]
