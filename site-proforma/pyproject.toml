[project]
name = "site-proforma"
version = "0.0.1"
description = "Toronto parcel site lookup and financial pro-forma."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "geopandas>=1.0",
    "shapely>=2.0",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "requests>=2.31",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
]

[project.scripts]
site-proforma = "site_proforma.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/site_proforma"]
