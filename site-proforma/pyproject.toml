[project]
name = "site-proforma"
version = "0.0.1"
description = "Toronto parcel site lookup + deterministic financial pro-forma."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
]

[project.optional-dependencies]
# Real GIS zoning/heritage join (point-in-polygon over the Zoning By-law layer).
gis = ["geopandas>=1.0", "shapely>=2.0"]
# CMHC rental-survey ingestion for neighbourhood-level rents.
cmhc = ["openpyxl>=3.1", "pandas>=2.2"]

[project.scripts]
site-proforma = "site_proforma.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/site_proforma"]
