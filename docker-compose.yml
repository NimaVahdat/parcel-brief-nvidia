services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: parcel-brief-postgres
    environment:
      POSTGRES_USER: hack
      POSTGRES_PASSWORD: hack
      POSTGRES_DB: hack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_extensions.sql:/docker-entrypoint-initdb.d/01_init_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hack -d hack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
