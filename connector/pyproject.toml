[project]
name = "connector"
version = "0.0.1"
description = "LangGraph orchestrator + FastAPI for parcel-brief."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "langgraph>=0.2",
    "httpx>=0.27",
    "shapely>=2.0",
    "vote-predictor",
    "opposition-generator",
    "massing-generator",
    "site-proforma",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connector"]
