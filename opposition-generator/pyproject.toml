[project]
name = "opposition-generator"
version = "0.0.1"
description = "Predicts community opposition to Toronto development projects, grounded in the real TMMIS deputation record."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# Postgres + pgvector backend (set DATABASE_URL). Default store is SQLite, no extra.
pg = ["pgvector>=0.2", "psycopg[binary]>=3.1"]
# TMMIS scraping.
scrape = ["playwright>=1.43"]
# PDF text extraction + OCR fallback for scanned deputations.
ocr = ["pypdf>=4.0", "pytesseract>=0.3.10", "pdf2image>=1.17"]
# sentence-transformers as an alternative local embedder (Ollama is the default).
st = ["sentence-transformers>=2.7"]

[project.scripts]
opposition-generator = "opposition_generator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opposition_generator"]
