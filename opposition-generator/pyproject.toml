[project]
name = "opposition-generator"
version = "0.0.1"
description = "Generates community opposition letters in the voice of the actual Toronto neighborhood."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "sentence-transformers>=2.7",
    "pgvector>=0.2",
    "psycopg[binary]>=3.1",
    "pypdf>=4.0",
    "pytesseract>=0.3.10",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
]

[project.scripts]
opposition-generator = "opposition_generator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opposition_generator"]
